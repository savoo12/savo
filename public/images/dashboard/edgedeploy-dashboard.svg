<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f9fafb" rx="8" />
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="64" fill="#4f46e5" rx="8" ry="0" />
  <text x="40" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="white">EdgeDeploy Dashboard</text>
  
  <!-- Navigation sidebar -->
  <rect x="0" y="64" width="240" height="736" fill="#f3f4f6" />
  
  <text x="30" y="120" font-family="Arial" font-size="16" font-weight="bold" fill="#374151">Navigation</text>
  <text x="30" y="160" font-family="Arial" font-size="15" fill="#6b7280">Dashboard</text>
  <text x="30" y="200" font-family="Arial" font-size="15" fill="#6b7280">Deployments</text>
  <text x="30" y="240" font-family="Arial" font-size="15" fill="#6b7280">Analytics</text>
  <text x="30" y="280" font-family="Arial" font-size="15" fill="#6b7280">Settings</text>
  <text x="30" y="320" font-family="Arial" font-size="15" fill="#6b7280">Documentation</text>
  
  <!-- Status Cards -->
  <rect x="280" y="100" width="260" height="140" fill="white" rx="8" stroke="#e5e7eb" stroke-width="1" />
  <text x="300" y="130" font-family="Arial" font-size="16" fill="#374151">Total Deployments</text>
  <text x="300" y="180" font-family="Arial" font-size="36" font-weight="bold" fill="#4f46e5">24</text>
  <text x="300" y="210" font-family="Arial" font-size="14" fill="#6b7280">↑ 12% from last month</text>
  
  <rect x="560" y="100" width="260" height="140" fill="white" rx="8" stroke="#e5e7eb" stroke-width="1" />
  <text x="580" y="130" font-family="Arial" font-size="16" fill="#374151">Avg. Response Time</text>
  <text x="580" y="180" font-family="Arial" font-size="36" font-weight="bold" fill="#4f46e5">78ms</text>
  <text x="580" y="210" font-family="Arial" font-size="14" fill="#22c55e">↓ 15% from last month</text>
  
  <rect x="840" y="100" width="260" height="140" fill="white" rx="8" stroke="#e5e7eb" stroke-width="1" />
  <text x="860" y="130" font-family="Arial" font-size="16" fill="#374151">Uptime</text>
  <text x="860" y="180" font-family="Arial" font-size="36" font-weight="bold" fill="#4f46e5">99.98%</text>
  <text x="860" y="210" font-family="Arial" font-size="14" fill="#6b7280">Last 30 days</text>
  
  <!-- Deployments Table -->
  <rect x="280" y="280" width="820" height="440" fill="white" rx="8" stroke="#e5e7eb" stroke-width="1" />
  <text x="300" y="320" font-family="Arial" font-size="18" font-weight="bold" fill="#374151">Recent Deployments</text>
  
  <!-- Table Headers -->
  <rect x="300" y="340" width="780" height="40" fill="#f9fafb" rx="4" />
  <text x="320" y="365" font-family="Arial" font-size="14" font-weight="bold" fill="#374151">Project</text>
  <text x="520" y="365" font-family="Arial" font-size="14" font-weight="bold" fill="#374151">Status</text>
  <text x="650" y="365" font-family="Arial" font-size="14" font-weight="bold" fill="#374151">Branch</text>
  <text x="780" y="365" font-family="Arial" font-size="14" font-weight="bold" fill="#374151">Deployed</text>
  <text x="940" y="365" font-family="Arial" font-size="14" font-weight="bold" fill="#374151">Performance</text>
  
  <!-- Table Rows -->
  <!-- Row 1 -->
  <line x1="300" y1="390" x2="1080" y2="390" stroke="#e5e7eb" stroke-width="1" />
  <text x="320" y="415" font-family="Arial" font-size="14" fill="#374151">ecommerce-site</text>
  <rect x="520" y="400" width="80" height="24" fill="#dcfce7" rx="12" />
  <text x="560" y="415" font-family="Arial" font-size="12" fill="#16a34a" text-anchor="middle">Live</text>
  <text x="650" y="415" font-family="Arial" font-size="14" fill="#374151">main</text>
  <text x="780" y="415" font-family="Arial" font-size="14" fill="#374151">5m ago</text>
  <rect x="940" y="400" width="120" height="8" fill="#f3f4f6" rx="4" />
  <rect x="940" y="400" width="105" height="8" fill="#22c55e" rx="4" />
  
  <!-- Row 2 -->
  <line x1="300" y1="440" x2="1080" y2="440" stroke="#e5e7eb" stroke-width="1" />
  <text x="320" y="465" font-family="Arial" font-size="14" fill="#374151">marketing-blog</text>
  <rect x="520" y="450" width="80" height="24" fill="#dcfce7" rx="12" />
  <text x="560" y="465" font-family="Arial" font-size="12" fill="#16a34a" text-anchor="middle">Live</text>
  <text x="650" y="465" font-family="Arial" font-size="14" fill="#374151">main</text>
  <text x="780" y="465" font-family="Arial" font-size="14" fill="#374151">2h ago</text>
  <rect x="940" y="450" width="120" height="8" fill="#f3f4f6" rx="4" />
  <rect x="940" y="450" width="110" height="8" fill="#22c55e" rx="4" />
  
  <!-- Row 3 -->
  <line x1="300" y1="490" x2="1080" y2="490" stroke="#e5e7eb" stroke-width="1" />
  <text x="320" y="515" font-family="Arial" font-size="14" fill="#374151">admin-dashboard</text>
  <rect x="520" y="500" width="80" height="24" fill="#dcfce7" rx="12" />
  <text x="560" y="515" font-family="Arial" font-size="12" fill="#16a34a" text-anchor="middle">Live</text>
  <text x="650" y="515" font-family="Arial" font-size="14" fill="#374151">main</text>
  <text x="780" y="515" font-family="Arial" font-size="14" fill="#374151">1d ago</text>
  <rect x="940" y="500" width="120" height="8" fill="#f3f4f6" rx="4" />
  <rect x="940" y="500" width="96" height="8" fill="#22c55e" rx="4" />
  
  <!-- Row 4 -->
  <line x1="300" y1="540" x2="1080" y2="540" stroke="#e5e7eb" stroke-width="1" />
  <text x="320" y="565" font-family="Arial" font-size="14" fill="#374151">customer-portal</text>
  <rect x="520" y="550" width="80" height="24" fill="#fef9c3" rx="12" />
  <text x="560" y="565" font-family="Arial" font-size="12" fill="#ca8a04" text-anchor="middle">Building</text>
  <text x="650" y="565" font-family="Arial" font-size="14" fill="#374151">dev</text>
  <text x="780" y="565" font-family="Arial" font-size="14" fill="#374151">Just now</text>
  <rect x="940" y="550" width="120" height="8" fill="#f3f4f6" rx="4" />
  <rect x="940" y="550" width="30" height="8" fill="#eab308" rx="4" />
  
  <!-- Row 5 -->
  <line x1="300" y1="590" x2="1080" y2="590" stroke="#e5e7eb" stroke-width="1" />
  <text x="320" y="615" font-family="Arial" font-size="14" fill="#374151">api-service</text>
  <rect x="520" y="600" width="80" height="24" fill="#fee2e2" rx="12" />
  <text x="560" y="615" font-family="Arial" font-size="12" fill="#dc2626" text-anchor="middle">Failed</text>
  <text x="650" y="615" font-family="Arial" font-size="14" fill="#374151">feature</text>
  <text x="780" y="615" font-family="Arial" font-size="14" fill="#374151">3h ago</text>
  <rect x="940" y="600" width="120" height="8" fill="#f3f4f6" rx="4" />
  <rect x="940" y="600" width="10" height="8" fill="#dc2626" rx="4" />
  
  <!-- Global Traffic Map -->
  <rect x="280" y="740" width="400" height="180" fill="white" rx="8" stroke="#e5e7eb" stroke-width="1" />
  <text x="300" y="770" font-family="Arial" font-size="16" font-weight="bold" fill="#374151">Global Traffic</text>
  
  <!-- World map simplified outline -->
  <path d="M320,820 C360,800 400,810 440,820 C480,830 520,810 560,820 C600,830 640,820 680,810" stroke="#e5e7eb" stroke-width="2" fill="none" />
  <path d="M320,850 C370,840 400,850 440,860 C480,870 530,850 560,860" stroke="#e5e7eb" stroke-width="2" fill="none" />
  
  <!-- Traffic hotspots -->
  <circle cx="420" cy="820" r="8" fill="#4f46e5" opacity="0.6" />
  <circle cx="520" cy="830" r="12" fill="#4f46e5" opacity="0.6" />
  <circle cx="380" cy="850" r="6" fill="#4f46e5" opacity="0.6" />
  <circle cx="620" cy="810" r="10" fill="#4f46e5" opacity="0.6" />
  <circle cx="480" cy="860" r="7" fill="#4f46e5" opacity="0.6" />
  
  <!-- Performance Chart -->
  <rect x="700" y="740" width="400" height="180" fill="white" rx="8" stroke="#e5e7eb" stroke-width="1" />
  <text x="720" y="770" font-family="Arial" font-size="16" font-weight="bold" fill="#374151">Response Time (Last 24h)</text>
  
  <!-- Chart line -->
  <polyline points="720,880 750,870 780,890 810,840 840,850 870,830 900,860 930,820 960,825 990,815 1020,840 1050,800 1080,810" 
           stroke="#4f46e5" stroke-width="3" fill="none" />
           
  <!-- Chart axis lines -->
  <line x1="720" y1="900" x2="1080" y2="900" stroke="#e5e7eb" stroke-width="1" />
  <line x1="720" y1="900" x2="720" y2="780" stroke="#e5e7eb" stroke-width="1" />
  
  <!-- Chart labels -->
  <text x="740" y="920" font-family="Arial" font-size="10" fill="#6b7280">12am</text>
  <text x="820" y="920" font-family="Arial" font-size="10" fill="#6b7280">6am</text>
  <text x="900" y="920" font-family="Arial" font-size="10" fill="#6b7280">12pm</text>
  <text x="980" y="920" font-family="Arial" font-size="10" fill="#6b7280">6pm</text>
  <text x="1060" y="920" font-family="Arial" font-size="10" fill="#6b7280">12am</text>
  
  <text x="700" y="880" font-family="Arial" font-size="10" fill="#6b7280" text-anchor="end">50ms</text>
  <text x="700" y="840" font-family="Arial" font-size="10" fill="#6b7280" text-anchor="end">75ms</text>
  <text x="700" y="800" font-family="Arial" font-size="10" fill="#6b7280" text-anchor="end">100ms</text>
</svg> 